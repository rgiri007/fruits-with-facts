name: Auto Refresh YouTube Token

on:
  schedule:
    # Run every 5 days — well before 7-day Testing mode expiry
    - cron: '0 8 * * */5'
  workflow_dispatch:  # Can also trigger manually

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Refresh YouTube token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os, sys

          print("Refreshing YouTube token...")

          r = requests.post("https://oauth2.googleapis.com/token", data={
              "client_id":     os.environ["YOUTUBE_CLIENT_ID"],
              "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
              "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
              "grant_type":    "refresh_token"
          })

          data = r.json()

          if "access_token" in data:
              print("Token is HEALTHY and refreshed successfully!")
              print("Token will not expire for another 7 days")

              if "refresh_token" in data:
                  print("\nNEW REFRESH TOKEN ISSUED BY GOOGLE:")
                  print("="*50)
                  print(data["refresh_token"])
                  print("="*50)
                  print("ACTION REQUIRED: Update YOUTUBE_REFRESH_TOKEN secret with above value!")
          else:
              print(f"Token refresh FAILED: {data}")
              print("\nACTION REQUIRED: Get a new refresh token!")
              print("Run the 'Get YouTube Refresh Token' workflow")
              sys.exit(1)
          PYEOF

      - name: Token refresh complete
        run: echo "YouTube token refreshed successfully at $(date)"
